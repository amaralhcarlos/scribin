# GoReleaser configuration for scribin.
# Builds the cmd/scribin binary for Linux, macOS and Windows (amd64/arm64),
# and publishes the archives plus a checksums file to the GitHub Release.
version: 2

project_name: scribin

before:
  hooks:
    - go mod tidy

builds:
  - id: scribin
    main: ./cmd/scribin
    binary: scribin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: scribin
    ids:
      - scribin
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
